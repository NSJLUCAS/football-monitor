name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install Chromium and CJK fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm run test:e2e
      - name: Keep the reviewed preview image
        # The browser tests re-shoot preview.png and screenshots; the package ships the committed preview.
        run: git checkout -- preview.png docs/screenshots
      - run: npm run package
      - run: npm run package:check
      - name: Name release assets
        run: |
          mkdir -p assets
          cp release/hub-install/theme.tar.gz assets/theme.tar.gz
          cp theme.tar.gz assets/football-monitor.tar.gz
          gzip -t assets/theme.tar.gz assets/football-monitor.tar.gz
          (cd assets && sha256sum theme.tar.gz football-monitor.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: theme-packages
          path: assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match theme.json version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./theme.json').version")"
      - uses: actions/download-artifact@v4
        with:
          name: theme-packages
          path: assets
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets && sha256sum -c SHA256SUMS.txt && cd ..
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/theme.tar.gz assets/football-monitor.tar.gz assets/SHA256SUMS.txt --clobber
          else
            awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
            gh release create "$GITHUB_REF_NAME" assets/theme.tar.gz assets/football-monitor.tar.gz assets/SHA256SUMS.txt \
              --verify-tag --title "Football Monitor $GITHUB_REF_NAME" --notes-file notes.md
          fi
