name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A normal run takes about 2 minutes; never let a stalled step hold the runner for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install Chromium and CJK fonts
        # Ubuntu mirrors sometimes stall mid-download (seen 2026-10-27: >9 min instead of ~20 s).
        # apt retries and times out per request; each attempt is capped at 4 minutes and retried up to 3 times.
        timeout-minutes: 15
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          install='npx playwright install --with-deps chromium && sudo apt-get install -y --no-install-recommends fonts-noto-cjk'
          for attempt in 1 2 3; do
            if timeout --kill-after=15s 4m sh -c "$install"; then
              exit 0
            fi
            echo "::warning::Chromium/CJK font install attempt $attempt failed or timed out; retrying"
            # A killed attempt can leave apt or dpkg holding its lock.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo dpkg --configure -a || true
            sleep 10
          done
          exit 1
      - run: npm run test:e2e
      - name: Keep the reviewed screenshots
        # The browser tests re-shoot the docs screenshots; the package ships the committed cover (npm run cover).
        run: git checkout -- preview.png docs/screenshots
      - run: npm run package
      - run: npm run package:check
      - name: Name release assets
        run: |
          mkdir -p assets
          cp release/hub-install/theme.tar.gz assets/theme.tar.gz
          cp theme.tar.gz assets/football-monitor.tar.gz
          gzip -t assets/theme.tar.gz assets/football-monitor.tar.gz
          (cd assets && sha256sum theme.tar.gz football-monitor.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: theme-packages
          path: assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match theme.json version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./theme.json').version")"
      - uses: actions/download-artifact@v4
        with:
          name: theme-packages
          path: assets
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets && sha256sum -c SHA256SUMS.txt && cd ..
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/theme.tar.gz assets/football-monitor.tar.gz assets/SHA256SUMS.txt --clobber
          else
            awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
            gh release create "$GITHUB_REF_NAME" assets/theme.tar.gz assets/football-monitor.tar.gz assets/SHA256SUMS.txt \
              --verify-tag --title "Football Monitor $GITHUB_REF_NAME" --notes-file notes.md
          fi
